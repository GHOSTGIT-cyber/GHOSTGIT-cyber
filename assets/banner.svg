<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Bakari Abidina — Ghost — Developpeur web freelance, automatisation IA, securite et infrastructure">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4DA3FF"/>
      <stop offset="100%" stop-color="#7FB4E8"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7FB4E8" stop-opacity="0"/>
      <stop offset="55%" stop-color="#7FB4E8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#9CCBF5" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7DB4EB" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="gridBig" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M160 0H0V160" fill="none" stroke="#7DB4EB" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="340" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="340" fill="#0B1A2A"/>
    <rect width="1280" height="340" fill="url(#grid)"/>
    <rect width="1280" height="340" fill="url(#gridBig)"/>

    <!-- ligne de scan : balayage lent du plan -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="-260,0; 1340,0" dur="9s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="240" height="340" fill="url(#scan)"/>
      <rect x="240" y="0" width="1.5" height="340" fill="#AED8FA" opacity="0.5"/>
    </g>

    <!-- cartouche -->
    <g font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="1.6" fill="#7FB4E8">
      <text x="56" y="44">PLANCHE 01 — PROFIL</text>
      <text x="1224" y="44" text-anchor="end">ÉCH. 1:1 · RÉV. 2026</text>
    </g>
    <line x1="56" y1="60" x2="1224" y2="60" stroke="#7DB4EB" stroke-opacity="0.22"/>

    <!-- bloc titre -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="56" y="122" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="3.4" fill="#7FB4E8">BAKARI ABIDINA</text>
      <text x="54" y="200" font-size="68" font-weight="600" letter-spacing="-1.6" fill="#F2F8FD">GHOST</text>
      <text x="56" y="238" font-size="18" fill="#A8C4DD">Développeur web freelance · Automatisation IA · Sécurité &amp; infra</text>
    </g>

    <!-- ligne de cote -->
    <g>
      <line x1="56" y1="272" x2="520" y2="272" stroke="#7DB4EB" stroke-opacity="0.45" stroke-dasharray="5 5"/>
      <line x1="56" y1="264" x2="56" y2="280" stroke="#7DB4EB" stroke-opacity="0.6"/>
      <line x1="520" y1="264" x2="520" y2="280" stroke="#7DB4EB" stroke-opacity="0.6"/>
      <rect x="212" y="262" width="152" height="20" fill="#0B1A2A"/>
      <text x="288" y="277" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11.5" letter-spacing="1.2" fill="#7FB4E8">ACTIF DEPUIS 2020</text>
    </g>

    <!-- repères stack, colonne droite -->
    <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="12" letter-spacing="1.3">
      <g transform="translate(700 100)">
        <rect width="140" height="30" fill="none" stroke="#7DB4EB" stroke-opacity="0.3"/>
        <text x="70" y="20" text-anchor="middle" fill="#BBD5EC">NEXT.JS</text>
      </g>
      <g transform="translate(852 100)">
        <rect width="118" height="30" fill="none" stroke="#7DB4EB" stroke-opacity="0.3"/>
        <text x="59" y="20" text-anchor="middle" fill="#BBD5EC">NODE</text>
      </g>
      <g transform="translate(982 100)">
        <rect width="178" height="30" fill="none" stroke="#7DB4EB" stroke-opacity="0.3"/>
        <text x="89" y="20" text-anchor="middle" fill="#BBD5EC">WORDPRESS</text>
      </g>
      <g transform="translate(700 142)">
        <rect width="140" height="30" fill="none" stroke="#7DB4EB" stroke-opacity="0.3"/>
        <text x="70" y="20" text-anchor="middle" fill="#BBD5EC">DOCKER</text>
      </g>
      <g transform="translate(852 142)">
        <rect width="118" height="30" fill="none" stroke="#7DB4EB" stroke-opacity="0.3"/>
        <text x="59" y="20" text-anchor="middle" fill="#BBD5EC">N8N</text>
      </g>
      <g transform="translate(982 142)">
        <rect width="178" height="30" fill="none" stroke="#7DB4EB" stroke-opacity="0.3"/>
        <text x="89" y="20" text-anchor="middle" fill="#BBD5EC">ODOO</text>
      </g>

      <g transform="translate(700 206)" font-size="11.5" letter-spacing="1.1">
        <line x1="0" y1="0" x2="460" y2="0" stroke="#7DB4EB" stroke-opacity="0.22"/>
        <text x="0" y="26" fill="#7FB4E8">BTS SIO · SLAM</text>
        <text x="180" y="26" fill="#7FB4E8">SECNUMACADÉMIE</text>
        <text x="380" y="26" fill="#7FB4E8">RGPD</text>
      </g>
    </g>

    <!-- repères d'angle -->
    <g stroke="#7DB4EB" stroke-opacity="0.5" stroke-width="1.5" fill="none">
      <path d="M24 44 L24 24 L44 24"/>
      <path d="M1236 24 L1256 24 L1256 44"/>
      <path d="M24 296 L24 316 L44 316"/>
      <path d="M1236 316 L1256 316 L1256 296"/>
    </g>

    <rect x="0" y="337" width="1280" height="3" fill="url(#accent)"/>
  </g>
</svg>
